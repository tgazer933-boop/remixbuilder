name: encrypted-build-bridge

on:
  workflow_dispatch:
    inputs:
      source_url_linux:
        required: false
      source_url_macos:
        required: false
      source_url_windows:
        required: false
      transfer_sha256:
        required: true
      source_sha256:
        required: true
      public_version:
        required: true
      recipe:
        required: true
      expires_at:
        required: true
      request_sig:
        required: true
      output_age_recipient:
        required: true
      output_key_wrap:
        required: true
      output_pass_wrap:
        required: true
      platforms:
        required: true

permissions: {}

concurrency:
  group: bridge-${{ inputs.public_version }}-${{ inputs.recipe }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      oss: ${{ steps.mk.outputs.oss }}
    steps:
      - name: Select platform matrix
        id: mk
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          SELECT=$(python3 <<'PYSEL'
          import json, os
          m = {"linux": "ubuntu-latest", "macos": "macos-latest", "windows": "windows-latest"}
          c = {"linux": "Linux", "macos": "macOS", "windows": "Windows"}
          items = [x for x in os.environ["PLATFORMS"].split(",") if x]
          if not items or any(x not in m for x in items):
              raise SystemExit("invalid platforms: " + os.environ["PLATFORMS"])
          print(json.dumps([m[x] for x in items]))
          print(" ".join(c[x] for x in items))
          PYSEL
          )
          MATRIX=$(sed -n 1p <<<"$SELECT")
          OSS=$(sed -n 2p <<<"$SELECT")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "oss=$OSS" >> "$GITHUB_OUTPUT"
          echo "selected: $MATRIX ($OSS)"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: {}
    env:
      SOURCE_URL_LINUX: ${{ inputs.source_url_linux }}
      SOURCE_URL_MACOS: ${{ inputs.source_url_macos }}
      SOURCE_URL_WINDOWS: ${{ inputs.source_url_windows }}
      TRANSFER_SHA256: ${{ inputs.transfer_sha256 }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
      RECIPE: ${{ inputs.recipe }}
      EXPIRES_AT: ${{ inputs.expires_at }}
      REQUEST_SIG: ${{ inputs.request_sig }}
      OUTPUT_AGE_RECIPIENT: ${{ inputs.output_age_recipient }}
      OUTPUT_KEY_WRAP: ${{ inputs.output_key_wrap }}
      OUTPUT_PASS_WRAP: ${{ inputs.output_pass_wrap }}
      PLATFORMS: ${{ inputs.platforms }}

    steps:
      - name: Install bridge tools
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS:?}" in
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq age
              ;;
            macOS)
              brew install age
              ;;
            Windows)
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/age.zip" \
                "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-windows-amd64.zip"
              (cd "$RUNNER_TEMP" && /c/Windows/System32/tar.exe -xf age.zip)
              echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/age:$PATH"
              age --version
              ;;
          esac
          age --version

      - name: Prepare trusted bridge scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge"
          cat > "$RUNNER_TEMP/bridge/verify.py" <<'PY'
          import base64, hashlib, hmac, os, re, sys
          from datetime import datetime, timezone
          fields = [os.environ[x] for x in (
              "SOURCE_URL_LINUX", "SOURCE_URL_MACOS", "SOURCE_URL_WINDOWS",
              "TRANSFER_SHA256", "SOURCE_SHA256",
              "PUBLIC_VERSION", "RECIPE", "EXPIRES_AT",
              "OUTPUT_AGE_RECIPIENT", "OUTPUT_KEY_WRAP", "OUTPUT_PASS_WRAP",
              "PLATFORMS"
          )]
          canonical = "v1\n" + "\n".join(fields)
          expected = hmac.new(
              os.environ["BRIDGE_SIGNING_KEY"].encode(),
              canonical.encode(), hashlib.sha256
          ).hexdigest()
          supplied = os.environ["REQUEST_SIG"].lower()
          if not hmac.compare_digest(expected, supplied):
              raise SystemExit("invalid request signature")
          allowed = {"linux", "macos", "windows"}
          chosen = os.environ["PLATFORMS"].split(",")
          if not chosen or any(p not in allowed for p in chosen):
              raise SystemExit("invalid platforms")
          for name in ("SOURCE_URL_LINUX", "SOURCE_URL_MACOS", "SOURCE_URL_WINDOWS"):
              if os.environ[name] and not os.environ[name].startswith("http://47.104.2.255:3001/objects/"):
                  raise SystemExit("invalid " + name)
          exp = datetime.fromisoformat(os.environ["EXPIRES_AT"].replace("Z", "+00:00"))
          if datetime.now(timezone.utc) >= exp:
              raise SystemExit("request expired")
          for name, pattern in (
              ("TRANSFER_SHA256", 64), ("SOURCE_SHA256", 64),
              ("PUBLIC_VERSION", 32), ("REQUEST_SIG", 64),
          ):
              value = os.environ[name]
              if len(value) != pattern or any(c not in "0123456789abcdef" for c in value):
                  raise SystemExit("invalid " + name)
          if not (1 <= len(os.environ["RECIPE"]) <= 40) or not all(
              c.isascii() and (c.isalnum() or c in "_-") for c in os.environ["RECIPE"]
          ):
              raise SystemExit("invalid recipe")
          if not re.fullmatch(r"age1[0-9a-z]{40,80}", os.environ["OUTPUT_AGE_RECIPIENT"]):
              raise SystemExit("invalid output_age_recipient")
          for name in ("OUTPUT_KEY_WRAP", "OUTPUT_PASS_WRAP"):
              value = os.environ[name]
              if not 24 <= len(value) <= 8192:
                  raise SystemExit("invalid " + name)
              try:
                  base64.b64decode(value, validate=True)
              except Exception:
                  raise SystemExit("invalid " + name)
          PY
          chmod 700 "$RUNNER_TEMP/bridge/verify.py"

      - name: Verify request
        shell: bash
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" "$RUNNER_TEMP/bridge/verify.py"

      - name: Download encrypted source
        shell: bash
        env:
          SOURCE_URL: ${{ runner.os == 'Linux' && inputs.source_url_linux || (runner.os == 'macOS' && inputs.source_url_macos || inputs.source_url_windows) }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 20 --max-time 600 \
            "$SOURCE_URL" -o bundle.tar
          actual=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum bundle.tar | awk '{print $1}'; else shasum -a 256 bundle.tar | awk '{print $1}'; fi)
          echo "downloaded $(wc -c < bundle.tar) bytes, sha256=$actual expected=$TRANSFER_SHA256"
          if [[ "$actual" != "$TRANSFER_SHA256" ]]; then
            head -c 64 bundle.tar | od -An -c | head -3
            echo "transfer sha256 mismatch" >&2
            exit 1
          fi
          mkdir -p bundle
          tar -xf bundle.tar -C bundle

      - name: Decrypt and verify source
        shell: bash
        env:
          BRIDGE_SOURCE_AGE_KEY: ${{ secrets.BRIDGE_SOURCE_AGE_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # The static secret only unwraps the one-time source key generated
          # for this build; the unwrapped key is destroyed right after use.
          printf '%s\n' "$BRIDGE_SOURCE_AGE_KEY" > bridge/unwrap.agekey
          chmod 600 bridge/unwrap.agekey
          age --decrypt -i bridge/unwrap.agekey -o bridge/source.agekey bundle/key.age
          age --decrypt -i bridge/source.agekey -o source.tar bundle/source.tar.age
          shred -u bridge/unwrap.agekey bridge/source.agekey 2>/dev/null \
            || rm -f bridge/unwrap.agekey bridge/source.agekey
          actual=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum source.tar | awk '{print $1}'; else shasum -a 256 source.tar | awk '{print $1}'; fi)
          if [[ "$actual" != "$SOURCE_SHA256" ]]; then
            echo "source sha256 mismatch: $actual" >&2
            exit 1
          fi
          mkdir -p build
          tar -xf source.tar -C build
          rm -f source.tar bundle.tar
          rm -rf bundle

      - name: Build source
        shell: bash
        run: |
          set -euo pipefail
          export BRIDGE_OUTPUT_DIR="$RUNNER_TEMP/output"
          mkdir -p "$BRIDGE_OUTPUT_DIR"
          cd "$RUNNER_TEMP/build/src"
          case "$RECIPE" in
            shell)
              test -f .bridge/build.sh
              bash ./.bridge/build.sh
              ;;
            *)
              echo "Unsupported recipe: $RECIPE" >&2
              exit 1
              ;;
          esac

      - name: Encrypt intermediate output
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP" && tar -C output -czf output.tar.gz .)
          age -r "$OUTPUT_AGE_RECIPIENT" \
            -o "$RUNNER_TEMP/output-${RUNNER_OS}.tar.gz.age" \
            "$RUNNER_TEMP/output.tar.gz"
          rm -rf "$RUNNER_TEMP/output" "$RUNNER_TEMP/output.tar.gz"

      - name: Upload encrypted intermediate
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-output-${{ runner.os }}
          path: ${{ runner.temp }}/output-${{ runner.os }}.tar.gz.age
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [select, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
      RECIPE: ${{ inputs.recipe }}
      OUTPUT_KEY_WRAP: ${{ inputs.output_key_wrap }}
      OUTPUT_PASS_WRAP: ${{ inputs.output_pass_wrap }}
      SELECTED_OSS: ${{ needs.select.outputs.oss }}

    steps:
      - name: Download encrypted intermediate (Linux)
        if: contains(needs.select.outputs.oss, 'Linux')
        uses: actions/download-artifact@v7
        with:
          name: encrypted-output-Linux

      - name: Download encrypted intermediate (macOS)
        if: contains(needs.select.outputs.oss, 'macOS')
        uses: actions/download-artifact@v7
        with:
          name: encrypted-output-macOS

      - name: Download encrypted intermediate (Windows)
        if: contains(needs.select.outputs.oss, 'Windows')
        uses: actions/download-artifact@v7
        with:
          name: encrypted-output-Windows

      - name: Package password-encrypted release
        env:
          BRIDGE_OUTPUT_AGE_KEY: ${{ secrets.BRIDGE_OUTPUT_AGE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age p7zip-full
          # Unwrap the one-time output keypair and passphrase for this build.
          wrap="$RUNNER_TEMP/bridge/unwrap.agekey"
          eph="$RUNNER_TEMP/bridge/output.agekey"
          mkdir -p "$RUNNER_TEMP/bridge"
          printf '%s\n' "$BRIDGE_OUTPUT_AGE_KEY" > "$wrap"
          chmod 600 "$wrap"
          printf '%s' "$OUTPUT_KEY_WRAP" | base64 -d > "$RUNNER_TEMP/bridge/output-key.age"
          printf '%s' "$OUTPUT_PASS_WRAP" | base64 -d > "$RUNNER_TEMP/bridge/pass.age"
          age --decrypt -i "$wrap" -o "$eph" "$RUNNER_TEMP/bridge/output-key.age"
          OUTPUT_PASSPHRASE=$(age --decrypt -i "$wrap" "$RUNNER_TEMP/bridge/pass.age")
          shred -u "$wrap" "$RUNNER_TEMP/bridge/pass.age"
          echo "::add-mask::$OUTPUT_PASSPHRASE"
          mkdir output
          for os in $SELECTED_OSS; do
            slug=$(printf '%s' "$os" | tr '[:upper:]' '[:lower:]')
            age --decrypt -i "$eph" -o "output-$os.tar.gz" "output-$os.tar.gz.age"
            mkdir "output/$slug"
            tar -xzf "output-$os.tar.gz" -C "output/$slug"
            rm -f "output-$os.tar.gz" "output-$os.tar.gz.age"
          done
          shred -u "$eph"
          rm -f "$RUNNER_TEMP/bridge/output-key.age"
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            printf 'source_sha256=%s\npublic_version=%s\nrecipe=%s\n' \
              "$SOURCE_SHA256" "$PUBLIC_VERSION" "$RECIPE" > BRIDGE-MANIFEST.txt
          )
          asset="artifact-$PUBLIC_VERSION.7z"
          (
            cd output
            7z a -bd -bso0 -bsp0 -t7z -mx=9 -mhe=on \
              -p"${OUTPUT_PASSPHRASE:?}" "../$asset" .
          )
          sha256sum "$asset" > "$asset.sha256"
          rm -rf output

      - name: Publish keyed public version
        run: |
          set -euo pipefail
          tag="build-$PUBLIC_VERSION"
          asset="artifact-$PUBLIC_VERSION.7z"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Build $PUBLIC_VERSION" \
              --notes "Encrypted artifact for keyed public version $PUBLIC_VERSION."
          fi
