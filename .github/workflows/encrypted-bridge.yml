name: encrypted-build-bridge

on:
  workflow_dispatch:
    inputs:
      source_url:
        required: true
      transfer_sha256:
        required: true
      source_sha256:
        required: true
      public_version:
        required: true
      recipe:
        required: true
      expires_at:
        required: true
      request_sig:
        required: true

permissions: {}

concurrency:
  group: bridge-${{ inputs.public_version }}-${{ inputs.recipe }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    env:
      SOURCE_URL: ${{ inputs.source_url }}
      TRANSFER_SHA256: ${{ inputs.transfer_sha256 }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
      RECIPE: ${{ inputs.recipe }}
      EXPIRES_AT: ${{ inputs.expires_at }}
      REQUEST_SIG: ${{ inputs.request_sig }}

    steps:
      - name: Install bridge tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age p7zip-full python3

      - name: Prepare trusted bridge scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge"
          cat > "$RUNNER_TEMP/bridge/verify.py" <<'PY'
          import hashlib, hmac, os, sys
          from datetime import datetime, timezone
          fields = [os.environ[x] for x in (
              "SOURCE_URL", "TRANSFER_SHA256", "SOURCE_SHA256",
              "PUBLIC_VERSION", "RECIPE", "EXPIRES_AT"
          )]
          canonical = "v1\n" + "\n".join(fields) + "\n"
          expected = hmac.new(
              os.environ["BRIDGE_SIGNING_KEY"].encode(),
              canonical.encode(), hashlib.sha256
          ).hexdigest()
          supplied = os.environ["REQUEST_SIG"].lower()
          if not hmac.compare_digest(expected, supplied):
              raise SystemExit("invalid request signature")
          exp = datetime.fromisoformat(os.environ["EXPIRES_AT"].replace("Z", "+00:00"))
          if datetime.now(timezone.utc) >= exp:
              raise SystemExit("request expired")
          for name, pattern in (
              ("TRANSFER_SHA256", 64), ("SOURCE_SHA256", 64),
              ("PUBLIC_VERSION", 32), ("REQUEST_SIG", 64),
          ):
              value = os.environ[name]
              if len(value) != pattern or any(c not in "0123456789abcdef" for c in value):
                  raise SystemExit("invalid " + name)
          if not (1 <= len(os.environ["RECIPE"]) <= 40) or not all(
              c.isascii() and (c.isalnum() or c in "_-") for c in os.environ["RECIPE"]
          ):
              raise SystemExit("invalid recipe")
          PY
          chmod 700 "$RUNNER_TEMP/bridge/verify.py"

      - name: Verify request
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/bridge/verify.py"

      - name: Download encrypted source
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 20 --max-time 600 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/source.tar.age"
          echo "$TRANSFER_SHA256  $RUNNER_TEMP/source.tar.age" | sha256sum -c -

      - name: Decrypt and verify source
        env:
          BRIDGE_SOURCE_AGE_KEY: ${{ secrets.BRIDGE_SOURCE_AGE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/source.agekey"
          printf '%s\n' "$BRIDGE_SOURCE_AGE_KEY" > "$key"
          chmod 600 "$key"
          age --decrypt -i "$key" -o "$RUNNER_TEMP/source.tar" \
            "$RUNNER_TEMP/source.tar.age"
          rm -f "$key"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/source.tar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/build"
          tar -xf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/build"
          rm -f "$RUNNER_TEMP/source.tar" "$RUNNER_TEMP/source.tar.age"

      - name: Build source
        run: |
          set -euo pipefail
          export BRIDGE_OUTPUT_DIR="$RUNNER_TEMP/output"
          mkdir -p "$BRIDGE_OUTPUT_DIR"
          cd "$RUNNER_TEMP/build/src"
          case "$RECIPE" in
            shell)
              test -x .bridge/build.sh
              ./.bridge/build.sh
              ;;
            *)
              echo "Unsupported recipe: $RECIPE" >&2
              exit 1
              ;;
          esac

      - name: Encrypt intermediate output
        env:
          OUTPUT_AGE_RECIPIENT: ${{ vars.OUTPUT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/output" -czf "$RUNNER_TEMP/output.tar.gz" .
          age -r "$OUTPUT_AGE_RECIPIENT" -o "$RUNNER_TEMP/output.tar.gz.age" \
            "$RUNNER_TEMP/output.tar.gz"
          rm -rf "$RUNNER_TEMP/output" "$RUNNER_TEMP/output.tar.gz"

      - name: Upload encrypted intermediate
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-output
          path: ${{ runner.temp }}/output.tar.gz.age
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PUBLIC_VERSION: ${{ inputs.public_version }}
      RECIPE: ${{ inputs.recipe }}

    steps:
      - name: Download encrypted intermediate
        uses: actions/download-artifact@v7
        with:
          name: encrypted-output

      - name: Package password-encrypted release
        env:
          BRIDGE_OUTPUT_AGE_KEY: ${{ secrets.BRIDGE_OUTPUT_AGE_KEY }}
          BRIDGE_OUTPUT_PASSPHRASE: ${{ secrets.BRIDGE_OUTPUT_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age p7zip-full
          key="$RUNNER_TEMP/output.agekey"
          printf '%s\n' "$BRIDGE_OUTPUT_AGE_KEY" > "$key"
          chmod 600 "$key"
          age --decrypt -i "$key" -o output.tar.gz output.tar.gz.age
          rm -f "$key"
          mkdir output
          tar -xzf output.tar.gz -C output
          rm -f output.tar.gz output.tar.gz.age
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            printf 'source_sha256=%s\npublic_version=%s\nrecipe=%s\n' \
              "$SOURCE_SHA256" "$PUBLIC_VERSION" "$RECIPE" > BRIDGE-MANIFEST.txt
          )
          asset="artifact-$PUBLIC_VERSION.7z"
          (
            cd output
            7z a -bd -bso0 -bsp0 -t7z -mx=9 -mhe=on \
              -p"${BRIDGE_OUTPUT_PASSPHRASE:?}" "../$asset" .
          )
          sha256sum "$asset" > "$asset.sha256"
          rm -rf output

      - name: Publish keyed public version
        run: |
          set -euo pipefail
          tag="build-$PUBLIC_VERSION"
          asset="artifact-$PUBLIC_VERSION.7z"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Build $PUBLIC_VERSION" \
              --notes "Encrypted artifact for keyed public version $PUBLIC_VERSION."
          fi
